<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關卡編輯器 — Tower Defense</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --accent2: #533483;
      --text: #eaeaea;
      --muted: #8892a4;
      --border: #2a3a5c;
      --input-bg: #0a1628;
      --hover: #1a3a6e;
      --success: #4caf50;
      --warn: #ff9800;
      --danger: #f44336;
      --radius: 8px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      flex: 1;
    }

    .btn {
      padding: 7px 16px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn:hover {
      filter: brightness(1.2);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--accent2);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-warn {
      background: var(--warn);
      color: #000;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.78rem;
    }

    /* ── LAYOUT ── */
    .workspace {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── LEFT SIDEBAR: WAVE LIST ── */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .wave-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wave-item {
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wave-item:hover {
      background: var(--hover);
    }

    .wave-item.active {
      background: var(--card);
      border-color: var(--accent);
    }

    .wave-num {
      background: var(--accent2);
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .wave-item.active .wave-num {
      background: var(--accent);
    }

    .wave-summary {
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-footer {
      padding: 10px 8px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar-footer .btn {
      flex: 1;
    }

    /* ── MAIN EDITOR ── */
    .editor {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-inner {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .section-title {
      padding: 10px 16px;
      background: var(--card);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    .section-body {
      padding: 16px;
    }

    /* ── WAVE SETTINGS ── */
    .wave-settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input[type="number"],
    .field input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── ENEMY PALETTE ── */
    .enemy-palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }

    .enemy-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .enemy-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      background: var(--hover);
    }

    .enemy-card:active {
      transform: translateY(0);
    }

    .enemy-card img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .enemy-card .enemy-emoji {
      font-size: 40px;
      line-height: 1;
    }

    .enemy-card .enemy-code {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }

    .enemy-card .enemy-name {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── SPAWN LIST ── */
    .spawn-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .spawn-list-empty {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
    }

    .spawn-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .spawn-row.is-cooldown {
      background: #1a1a0e;
      border-color: #5a4e00;
      border-style: dashed;
    }

    .spawn-icon {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 100px;
    }

    .spawn-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .spawn-icon .spawn-emoji {
      font-size: 28px;
      line-height: 1;
    }

    .spawn-icon .spawn-name {
      font-size: 0.82rem;
      font-weight: 600;
    }

    .spawn-field {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spawn-field label {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .spawn-field input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 5px 8px;
      font-size: 0.85rem;
      font-family: inherit;
      width: 70px;
      transition: border-color 0.15s;
    }

    .spawn-field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .spawn-row-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .drag-handle {
      cursor: grab;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 0 4px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .cooldown-badge {
      background: #4a3e00;
      color: var(--warn);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* ── TIMELINE PREVIEW ── */
    .timeline-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .timeline {
      display: flex;
      align-items: flex-start;
      gap: 0;
      padding: 12px 8px;
      min-width: max-content;
    }

    .tl-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tl-icons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      max-width: 200px;
    }

    .tl-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .tl-emoji {
      font-size: 22px;
      line-height: 28px;
    }

    .tl-count {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .tl-sep {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      margin-top: 8px;
    }

    .tl-line {
      width: 2px;
      height: 20px;
      background: var(--border);
    }

    .tl-cd {
      background: #4a3e00;
      color: var(--warn);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .tl-arrow {
      color: var(--muted);
      font-size: 1rem;
      margin: 2px 0;
    }

    /* ── EXPORT/IMPORT MODAL ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: min(600px, 95vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    .modal h2 {
      font-size: 1rem;
      color: var(--accent);
    }

    .modal textarea {
      width: 100%;
      height: 260px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px;
      font-size: 0.85rem;
      font-family: 'Consolas', 'Courier New', monospace;
      resize: vertical;
      transition: border-color 0.15s;
    }

    .modal textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ── NO WAVE SELECTED ── */
    .no-selection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--muted);
    }

    .no-selection .big-icon {
      font-size: 4rem;
    }

    /* ── DRAG OVER ── */
    .spawn-row.drag-over {
      border-color: var(--accent);
      background: var(--hover);
    }

    .spawn-row.dragging {
      opacity: 0.4;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <header>
    <h1>🗺️ Tower Defense 關卡編輯器</h1>
    <button class="btn btn-secondary" onclick="openImport()">📥 匯入 levels.txt</button>
    <button class="btn btn-success" onclick="openExport()">📤 匯出 levels.txt</button>
  </header>

  <div class="workspace">
    <!-- LEFT: WAVE LIST -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>關卡清單</h2>
        <span id="wave-count-label" style="font-size:0.8rem;color:var(--muted)">0 波</span>
      </div>
      <div class="wave-list" id="wave-list"></div>
      <div class="sidebar-footer">
        <button class="btn btn-primary btn-sm" onclick="addWave()">＋ 新增波次</button>
        <button class="btn btn-danger btn-sm" onclick="deleteWave()">✕ 刪除</button>
      </div>
    </aside>

    <!-- RIGHT: EDITOR -->
    <main class="editor">
      <div class="editor-inner" id="editor-inner">
        <div class="no-selection">
          <div class="big-icon">🗺️</div>
          <div>請選擇或新增一個波次以開始編輯</div>
        </div>
      </div>
    </main>
  </div>

  <!-- EXPORT MODAL -->
  <div class="modal-backdrop" id="export-modal">
    <div class="modal">
      <h2>📤 匯出 levels.txt</h2>
      <textarea id="export-ta" readonly></textarea>
      <div class="modal-actions">
        <button class="btn btn-success" onclick="downloadLevels()">⬇️ 下載 levels.txt</button>
        <button class="btn btn-secondary" onclick="copyExport()">📋 複製</button>
        <button class="btn btn-ghost" onclick="closeModal('export-modal')">關閉</button>
      </div>
    </div>
  </div>

  <!-- IMPORT MODAL -->
  <div class="modal-backdrop" id="import-modal">
    <div class="modal">
      <h2>📥 匯入 levels.txt</h2>
      <textarea id="import-ta" placeholder="貼上 levels.txt 的內容…"></textarea>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="doImport()">匯入</button>
        <button class="btn btn-ghost" onclick="closeModal('import-modal')">取消</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────────
    //  DATA DEFINITIONS
    // ─────────────────────────────────────────────────────────────────────────────
    const ENEMIES = [
      { code: 'SK', name: '黑色史萊姆', color: '#333333', img: '../resources/object/monster/monster_black.png' },
      { code: 'SR', name: '紅色史萊姆', color: '#F44336', img: '../resources/object/monster/monster_red.png' },
      { code: 'SG', name: '綠色史萊姆', color: '#4CAF50', img: '../resources/object/monster/monster_green.png' },
      { code: 'SB', name: '藍色史萊姆', color: '#2196F3', img: '../resources/object/monster/monster_blue.png' },
      { code: 'SP', name: '紫色史萊姆', color: '#9C27B0', img: '../resources/object/monster/monster_purple.png' },
      { code: 'FA', name: '天使', color: '#BDBDBD', img: '../resources/object/monster/angel_2.png' },
      { code: 'FB', name: '小鳥', color: '#FF9800', img: '../resources/object/monster/bird_24.png' },
      { code: 'FD', name: '飛龍', color: '#FF5722', img: '../resources/object/monster/dragon_2.png' },
      { code: 'FW', name: '旋風怪', color: '#00BCD4', img: '../resources/object/monster/angel_1.png' },
    ];
    const ENEMY_MAP = Object.fromEntries(ENEMIES.map(e => [e.code, e]));

    // ─────────────────────────────────────────────────────────────────────────────
    //  STATE
    //  waves: Array of wave objects
    //  wave = { hpMult: number, items: Array<item> }
    //  item = { type: 'enemy', code, count } | { type: 'cooldown', value }
    //
    //  In the file format, the first number after hp_multiplier sets the "current
    //  cooldown". Then each ENEMY_CODE*count spawns that enemy. A new number
    //  mid-line changes the cooldown. We model this as a flat list of items
    //  where cooldown items appear between enemy groups.
    // ─────────────────────────────────────────────────────────────────────────────
    let waves = [];
    let selectedIdx = -1;
    let dragSrcIdx = null; // index in items array

    // ─────────────────────────────────────────────────────────────────────────────
    //  HELPERS
    // ─────────────────────────────────────────────────────────────────────────────
    function getEnemy(code) { return ENEMY_MAP[code] || null; }

    function enemyIconHTML(code, size = 32) {
      const e = getEnemy(code);
      if (!e) return `<span style="font-size:${size}px">❓</span>`;
      if (e.emoji) return `<span class="spawn-emoji" style="font-size:${size * 0.9}px">${e.emoji}</span>`;
      return `<img src="${e.img}" width="${size}" height="${size}" style="object-fit:contain;image-rendering:pixelated;" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:${size * 0.7}px;background:${e.color};border-radius:4px;padding:2px\\'>${e.code}</span>')">`;
    }

    function showToast(msg, color = '#4caf50') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    //  RENDER
    // ─────────────────────────────────────────────────────────────────────────────
    function renderAll() {
      renderWaveList();
      renderEditor();
    }

    function waveSummary(wave) {
      if (!wave.items.length) return '（空波次）';
      const parts = [];
      wave.items.forEach(item => {
        if (item.type === 'enemy') {
          const e = getEnemy(item.code);
          parts.push(`${e ? e.name.slice(0, 2) : item.code}×${item.count}`);
        }
      });
      return parts.join(' ') || '（空波次）';
    }

    function renderWaveList() {
      const list = document.getElementById('wave-list');
      list.innerHTML = '';
      waves.forEach((wave, i) => {
        const div = document.createElement('div');
        div.className = 'wave-item' + (i === selectedIdx ? ' active' : '');
        div.innerHTML = `
      <div class="wave-num">${i + 1}</div>
      <div>
        <div style="font-size:0.85rem;font-weight:600">波次 ${i + 1}</div>
        <div class="wave-summary">${waveSummary(wave)}</div>
      </div>`;
        div.onclick = () => selectWave(i);
        list.appendChild(div);
      });
      document.getElementById('wave-count-label').textContent = `${waves.length} 波`;
    }

    function renderEditor() {
      const inner = document.getElementById('editor-inner');
      if (selectedIdx < 0 || selectedIdx >= waves.length) {
        inner.innerHTML = `<div class="no-selection"><div class="big-icon">🗺️</div><div>請選擇或新增一個波次以開始編輯</div></div>`;
        return;
      }
      const wave = waves[selectedIdx];

      inner.innerHTML = `
    <!-- WAVE SETTINGS -->
    <div class="section">
      <div class="section-title">⚙️ 波次設定 — 波次 ${selectedIdx + 1}</div>
      <div class="section-body">
        <div class="wave-settings-grid">
          <div class="field">
            <label>HP 倍率 (hp_multiplier)</label>
            <input type="number" id="hp-mult" min="0.1" step="0.1" value="${wave.hpMult}"
              oninput="waves[selectedIdx].hpMult=parseFloat(this.value)||1.0;renderWaveList();">
          </div>
          <div class="field">
            <label>提示：在生成清單中加入「冷卻變更」來設定各組生成間隔</label>
            <input type="text" readonly value="詳見下方生成清單" style="color:var(--muted);cursor:default;">
          </div>
        </div>
      </div>
    </div>

    <!-- ENEMY PALETTE -->
    <div class="section">
      <div class="section-title">🐾 點擊敵人加入本波次</div>
      <div class="section-body">
        <div class="enemy-palette" id="enemy-palette"></div>
      </div>
    </div>

    <!-- SPAWN LIST -->
    <div class="section">
      <div class="section-title">📋 生成清單</div>
      <div class="section-body" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <button class="btn btn-warn btn-sm" onclick="insertCooldown()">⏱ 插入冷卻變更</button>
          <span style="font-size:0.78rem;color:var(--muted)">在清單末尾插入一個冷卻值變更節點（可拖曳重排）</span>
        </div>
        <div class="spawn-list" id="spawn-list"></div>
      </div>
    </div>

    <!-- TIMELINE PREVIEW -->
    <div class="section">
      <div class="section-title">🎬 波次時間軸預覽</div>
      <div class="section-body">
        <div class="timeline-wrap"><div class="timeline" id="timeline"></div></div>
      </div>
    </div>
  `;

      renderPalette();
      renderSpawnList();
      renderTimeline();
    }

    function renderPalette() {
      const palette = document.getElementById('enemy-palette');
      if (!palette) return;
      palette.innerHTML = '';
      ENEMIES.forEach(e => {
        const card = document.createElement('div');
        card.className = 'enemy-card';
        card.title = `點擊加入 ${e.name}`;
        const iconPart = e.emoji
          ? `<div class="enemy-emoji">${e.emoji}</div>`
          : `<img src="${e.img}" alt="${e.name}" onerror="this.style.background='${e.color}';this.style.borderRadius='6px'">`;
        card.innerHTML = `
      ${iconPart}
      <span class="enemy-code" style="background:${e.color}">${e.code}</span>
      <span class="enemy-name">${e.name}</span>`;
        card.onclick = () => addEnemy(e.code);
        palette.appendChild(card);
      });
    }

    function renderSpawnList() {
      const list = document.getElementById('spawn-list');
      if (!list) return;
      const wave = waves[selectedIdx];
      list.innerHTML = '';

      if (!wave.items.length) {
        list.innerHTML = `<div class="spawn-list-empty">尚未加入任何敵人<br>點擊上方敵人卡片開始新增</div>`;
        return;
      }

      wave.items.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'spawn-row' + (item.type === 'cooldown' ? ' is-cooldown' : '');
        row.draggable = true;
        row.dataset.idx = i;

        if (item.type === 'cooldown') {
          row.innerHTML = `
        <div class="drag-handle">⠿</div>
        <span class="cooldown-badge">⏱ 冷卻變更</span>
        <div class="spawn-field">
          <label>冷卻值 (秒)</label>
          <input type="number" min="0" step="0.1" value="${item.value}"
            oninput="waves[selectedIdx].items[${i}].value=parseFloat(this.value)||0;renderTimeline();">
        </div>
        <div class="spawn-row-actions">
          <button class="btn btn-danger btn-sm" onclick="removeItem(${i})">✕</button>
        </div>`;
        } else {
          const e = getEnemy(item.code);
          const iconPart = e && e.emoji
            ? `<span class="spawn-emoji">${e.emoji}</span>`
            : `<img src="${e ? e.img : ''}" width="32" height="32" style="object-fit:contain;image-rendering:pixelated;"
            onerror="this.outerHTML='<span style=\\'background:${e ? e.color : '#888'};border-radius:4px;padding:2px 4px;font-size:0.7rem;font-weight:700\\'>${item.code}</span>'">`;
          row.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="spawn-icon">
          ${iconPart}
          <span class="spawn-name">${e ? e.name : item.code}</span>
        </div>
        <div class="spawn-field">
          <label>數量</label>
          <input type="number" min="1" step="1" value="${item.count}"
            oninput="waves[selectedIdx].items[${i}].count=parseInt(this.value)||1;renderWaveList();renderTimeline();">
        </div>
        <div class="spawn-row-actions">
          <button class="btn btn-danger btn-sm" onclick="removeItem(${i})">✕</button>
        </div>`;
        }

        // drag events
        row.addEventListener('dragstart', e => { dragSrcIdx = i; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        row.addEventListener('dragend', () => { row.classList.remove('dragging'); clearDragOver(); });
        row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); e.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', e => {
          e.preventDefault();
          row.classList.remove('drag-over');
          if (dragSrcIdx !== null && dragSrcIdx !== i) {
            const items = waves[selectedIdx].items;
            const [moved] = items.splice(dragSrcIdx, 1);
            items.splice(i, 0, moved);
            renderEditor();
          }
        });

        list.appendChild(row);
      });
    }

    function clearDragOver() {
      document.querySelectorAll('.spawn-row.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function renderTimeline() {
      const tl = document.getElementById('timeline');
      if (!tl) return;
      const wave = waves[selectedIdx];
      tl.innerHTML = '';

      if (!wave.items.length) {
        tl.innerHTML = `<span style="color:var(--muted);font-size:0.85rem">（此波次沒有敵人）</span>`;
        return;
      }

      let firstGroup = true;
      wave.items.forEach((item, i) => {
        if (item.type === 'cooldown') {
          const sep = document.createElement('div');
          sep.className = 'tl-sep';
          sep.innerHTML = `<div class="tl-arrow">→</div><div class="tl-cd">⏱ ${item.value}s</div><div class="tl-arrow">→</div>`;
          tl.appendChild(sep);
        } else {
          const e = getEnemy(item.code);
          const group = document.createElement('div');
          group.className = 'tl-group';

          // Show up to 10 icons, then "+N"
          const iconCount = Math.min(item.count, 10);
          let iconsHTML = '';
          for (let k = 0; k < iconCount; k++) {
            if (e && e.emoji) {
              iconsHTML += `<span class="tl-emoji">${e.emoji}</span>`;
            } else if (e) {
              iconsHTML += `<img class="tl-icon" src="${e.img}" onerror="this.style.display='none'">`;
            }
          }
          if (item.count > 10) iconsHTML += `<span style="font-size:0.7rem;color:var(--muted);align-self:center">+${item.count - 10}</span>`;

          group.innerHTML = `
        <div class="tl-icons">${iconsHTML}</div>
        <div class="tl-count">${e ? e.name : item.code} × ${item.count}</div>`;
          tl.appendChild(group);
        }
      });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    //  ACTIONS
    // ─────────────────────────────────────────────────────────────────────────────
    function selectWave(i) {
      selectedIdx = i;
      renderAll();
    }

    function addWave() {
      waves.push({ hpMult: 1.0, items: [] });
      selectedIdx = waves.length - 1;
      renderAll();
      // scroll to bottom of wave list
      const wl = document.getElementById('wave-list');
      wl.scrollTop = wl.scrollHeight;
    }

    function deleteWave() {
      if (selectedIdx < 0 || selectedIdx >= waves.length) { showToast('請先選擇要刪除的波次', '#f44336'); return; }
      if (!confirm(`確定要刪除波次 ${selectedIdx + 1}？`)) return;
      waves.splice(selectedIdx, 1);
      if (selectedIdx >= waves.length) selectedIdx = waves.length - 1;
      renderAll();
    }

    function addEnemy(code) {
      if (selectedIdx < 0) { showToast('請先選擇波次', '#f44336'); return; }
      const wave = waves[selectedIdx];
      // If last item is same enemy, just increment count
      const last = wave.items[wave.items.length - 1];
      if (last && last.type === 'enemy' && last.code === code) {
        last.count++;
      } else {
        wave.items.push({ type: 'enemy', code, count: 1 });
      }
      renderSpawnList();
      renderTimeline();
      renderWaveList();
    }

    function removeItem(i) {
      waves[selectedIdx].items.splice(i, 1);
      renderSpawnList();
      renderTimeline();
      renderWaveList();
    }

    function insertCooldown() {
      if (selectedIdx < 0) return;
      waves[selectedIdx].items.push({ type: 'cooldown', value: 1.0 });
      renderSpawnList();
      renderTimeline();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    //  EXPORT / IMPORT
    // ─────────────────────────────────────────────────────────────────────────────
    /*
      Format (from analysis of actual levels.txt):
        Line number TAB hp_multiplier_token cooldown ENEMY*count ...
      hp_multiplier_token can be plain number (wave 1-3 style) or x<number> (wave 4+)
      We'll just output plain numbers for simplicity — the parser should accept both.
      Actually looking at the file more carefully:
      - Lines 1-3 start without "x" prefix
      - Lines 4+ use "x1.1" etc.
      We'll replicate by outputting "x<hp>" for multipliers != 1.0, otherwise "1"
      Actually let's just always output x<hp> to be safe since the game likely handles both.
    
      Flat output per wave:
        waveNum TAB [x]hpMult cooldown ENEMY*count [cooldown ENEMY*count ...]
    
      The items list: we collapse consecutive cooldown changes (last one wins before
      an enemy group). If no cooldown before first enemy, we default to 1.0.
    */
    function serializeWaves() {
      const lines = [];
      waves.forEach((wave, wi) => {
        const hpStr = `x${wave.hpMult.toFixed(1)}`;
        const parts = [hpStr];
        // build token stream: prepend default cooldown before first enemy if needed
        let pendingCooldown = null;
        let needsCooldownBeforeNext = true; // first enemy needs a cooldown prefix
        wave.items.forEach(item => {
          if (item.type === 'cooldown') {
            pendingCooldown = item.value;
          } else {
            // emit cooldown before this enemy group
            if (needsCooldownBeforeNext || pendingCooldown !== null) {
              parts.push((pendingCooldown !== null ? pendingCooldown : 1.0).toFixed(1));
              pendingCooldown = null;
              needsCooldownBeforeNext = false;
            }
            parts.push(`${item.code}*${item.count}`);
          }
        });
        lines.push(parts.join(' '));
      });
      return lines.join('\n');
    }

    function openExport() {
      const content = serializeWaves();
      document.getElementById('export-ta').value = content;
      document.getElementById('export-modal').classList.add('open');
    }

    function copyExport() {
      const ta = document.getElementById('export-ta');
      ta.select();
      navigator.clipboard.writeText(ta.value).then(() => showToast('已複製到剪貼簿！')).catch(() => {
        document.execCommand('copy');
        showToast('已複製！');
      });
    }

    function downloadLevels() {
      const content = serializeWaves();
      const blob = new Blob([content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'levels.txt';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('下載中…');
    }

    function openImport() {
      document.getElementById('import-ta').value = '';
      document.getElementById('import-modal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Click outside modal to close
    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.classList.remove('open'); });
    });

    /*
      Parse a levels.txt line.
      Format variants observed:
        waveNum TAB rest
        rest = [x]hpMult tokens...
        tokens = number (new cooldown) | ENEMY*count
      Some lines omit the hp multiplier entirely (treated as 1.0).
      Actually from the file: every line starts with waveNum TAB.
      The "rest" either starts with x<float> or a plain number or ENEMY*count.
    
      Algorithm: split rest by whitespace, parse tokens left-to-right.
      - If token matches /^x?([\d.]+)$/ and doesn't contain '*' -> could be hpMult or cooldown
      - If token matches /^[A-Z]+\*\d+$/ -> enemy
    
      First non-enemy token at the start: if it looks like "x<n>" it's hp multiplier.
      After that, numbers are cooldowns and ENEMY*count are enemies.
    */
    function parseWaveTokens(rest) {
      const tokens = rest.trim().split(/\s+/).filter(Boolean);
      let hpMult = 1.0;
      let items = [];
      let idx = 0;
      let firstToken = true;

      while (idx < tokens.length) {
        const tok = tokens[idx];
        if (/^[A-Za-z]+\*\d+$/.test(tok)) {
          // ENEMY*count
          const [code, countStr] = tok.split('*');
          items.push({ type: 'enemy', code: code.toUpperCase(), count: parseInt(countStr) });
          firstToken = false;
          idx++;
        } else if (/^x[\d.]+$/i.test(tok)) {
          // hp multiplier like x1.5
          hpMult = parseFloat(tok.slice(1));
          firstToken = false;
          idx++;
        } else if (/^[\d.]+$/.test(tok)) {
          if (firstToken) {
            // ambiguous: could be wave-1-style hp multiplier (no 'x') or first cooldown
            // heuristic: if it's followed by an enemy token, treat as cooldown
            // if there's an 'x' prefix wave, this won't appear
            // from file: lines 1-3 have plain numbers as first token that are cooldowns, not hp
            // Line 1: "1.5 SG*5 SK*1..." -> 1.5 is cooldown, hp=1
            // So for non-x format, first number = cooldown
            items.push({ type: 'cooldown', value: parseFloat(tok) });
          } else {
            items.push({ type: 'cooldown', value: parseFloat(tok) });
          }
          firstToken = false;
          idx++;
        } else {
          idx++; // skip unknown
        }
      }

      return { hpMult, items };
    }

    function doImport() {
      const raw = document.getElementById('import-ta').value.trim();
      if (!raw) { showToast('請貼上 levels.txt 內容', '#f44336'); return; }
      const lines = raw.split('\n').filter(l => l.trim());
      const parsed = [];
      lines.forEach(line => {
        // strip wave number prefix if present (number + tab or number + space at start)
        let rest = line.trim();
        const m = rest.match(/^(\d+)\s+(.*)$/);
        if (m) rest = m[2];
        const { hpMult, items } = parseWaveTokens(rest);
        parsed.push({ hpMult, items });
      });
      if (!parsed.length) { showToast('未能解析任何波次', '#f44336'); return; }
      waves = parsed;
      selectedIdx = 0;
      closeModal('import-modal');
      renderAll();
      showToast(`已匯入 ${parsed.length} 個波次！`);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    //  INIT — load the bundled default levels
    // ─────────────────────────────────────────────────────────────────────────────
    (function init() {
      // 空白開始，使用匯入功能載入 levels.txt
      renderAll();
    })();
  </script>
